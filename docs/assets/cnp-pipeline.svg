<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="610" viewBox="0 0 1150 610" role="img" aria-labelledby="title desc">
  <title id="title">Clarification Need Prediction pipeline with QPP and semantic features</title>
  <desc id="desc">A simplified overview of integrating pre-retrieval QPP, post-retrieval QPP, and fine-tuned PLM signals through Min-Max normalization and logistic regression to decide whether to ask a clarification question.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3867d6"/>
      <stop offset="1" stop-color="#7b2cbf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#112244" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #111827; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #4b5563; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #111827; }
      .text { font: 500 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #4b5563; }
      .small { font: 500 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #6b7280; }
      .mono { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2937; }
      .card { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1.2; filter: url(#shadow); }
      .pill { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1; }
      .line { stroke: #4b5563; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1150" height="610" rx="26" fill="url(#bg)"/>
  <rect x="26" y="24" width="1098" height="562" rx="24" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>

  <text x="575" y="58" text-anchor="middle" class="title">Clarification Need Prediction with QPP × Semantic Features</text>
  <text x="575" y="87" text-anchor="middle" class="subtitle">曖昧な検索クエリに対して、いつ「明確化質問」を返すべきかを予測する</text>

  <!-- Query -->
  <rect x="54" y="228" width="220" height="132" rx="18" class="card"/>
  <rect x="80" y="250" width="122" height="26" rx="13" class="pill"/>
  <text x="141" y="268" text-anchor="middle" class="small">User query</text>
  <text x="164" y="307" text-anchor="middle" class="mono">What was</text>
  <text x="164" y="330" text-anchor="middle" class="mono">Jordan's career?</text>
  <text x="164" y="352" text-anchor="middle" class="small">曖昧性を含む入力</text>

  <!-- Signals -->
  <rect x="350" y="142" width="250" height="108" rx="18" class="card"/>
  <text x="475" y="172" text-anchor="middle" class="label">Semantic feature</text>
  <text x="475" y="198" text-anchor="middle" class="text">Fine-tuned BERT / RoBERTa</text>
  <text x="475" y="222" text-anchor="middle" class="small">クエリの意味的曖昧性を表す logit</text>

  <rect x="350" y="276" width="250" height="108" rx="18" class="card"/>
  <text x="475" y="306" text-anchor="middle" class="label">Pre-retrieval QPP</text>
  <text x="475" y="332" text-anchor="middle" class="text">AvgIDF, MaxSCQ, SCS ...</text>
  <text x="475" y="356" text-anchor="middle" class="small">検索前のクエリ・コーパス統計</text>

  <rect x="350" y="410" width="250" height="108" rx="18" class="card"/>
  <text x="475" y="440" text-anchor="middle" class="label">Post-retrieval QPP</text>
  <text x="475" y="466" text-anchor="middle" class="text">WIG, NQC, SMV, Clarity ...</text>
  <text x="475" y="490" text-anchor="middle" class="small">検索後のランキング・スコア分布</text>

  <!-- Integration -->
  <rect x="690" y="232" width="210" height="126" rx="18" class="card"/>
  <text x="795" y="264" text-anchor="middle" class="label">Min-Max</text>
  <text x="795" y="287" text-anchor="middle" class="label">Normalization</text>
  <text x="795" y="318" text-anchor="middle" class="text">0–1 にスケーリング</text>
  <text x="795" y="341" text-anchor="middle" class="small">異なるスコア範囲を揃える</text>

  <rect x="690" y="398" width="210" height="126" rx="18" class="card"/>
  <text x="795" y="431" text-anchor="middle" class="label">Logistic regression</text>
  <text x="795" y="458" text-anchor="middle" class="text">None / L1 / L2 / ElasticNet</text>
  <text x="795" y="486" text-anchor="middle" class="small">P(y = 1 | x) を推定</text>

  <!-- Decision -->
  <rect x="970" y="286" width="128" height="84" rx="18" fill="#4f46e5"/>
  <text x="1034" y="318" text-anchor="middle" style="font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#fff;">Decision</text>
  <text x="1034" y="344" text-anchor="middle" style="font: 600 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#eef2ff;">Ask or answer?</text>

  <rect x="930" y="116" width="168" height="98" rx="16" class="card"/>
  <text x="1014" y="149" text-anchor="middle" class="label">Ask clarification</text>
  <text x="1014" y="177" text-anchor="middle" class="small">“Jordan” は人名・ブランド・</text>
  <text x="1014" y="197" text-anchor="middle" class="small">国のどれですか？</text>

  <rect x="930" y="436" width="168" height="98" rx="16" class="card"/>
  <text x="1014" y="469" text-anchor="middle" class="label">Direct answer</text>
  <text x="1014" y="497" text-anchor="middle" class="small">十分に明確なら回答へ進む</text>

  <!-- Arrows -->
  <path d="M 274 286 C 306 236, 315 190, 350 190" class="line"/>
  <path d="M 274 304 C 312 312, 320 328, 350 330" class="line"/>
  <path d="M 274 325 C 311 395, 318 456, 350 462" class="line"/>

  <path d="M 600 196 C 646 206, 666 244, 690 266" class="line"/>
  <path d="M 600 330 C 638 326, 655 312, 690 302" class="line"/>
  <path d="M 600 464 C 648 454, 664 391, 690 331" class="line"/>

  <path d="M 795 358 L 795 398" class="line"/>
  <path d="M 900 461 C 938 448, 956 385, 970 348" class="line"/>
  <path d="M 1034 286 C 1036 248, 1030 226, 1014 214" class="line"/>
  <path d="M 1034 370 C 1036 404, 1028 423, 1014 436" class="line"/>

  <!-- Bottom note -->
  <rect x="62" y="536" width="1026" height="30" rx="15" fill="#f3f4f6"/>
  <text x="575" y="556" text-anchor="middle" class="small">Research question: 意味的特徴（PLM）と検索有効性の推定（QPP）は、明確化必要性予測で相補的に機能するか？</text>
</svg>
