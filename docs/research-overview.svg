<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Clarification Need Prediction overview</title>
  <desc id="desc">A flow diagram showing a user query being processed by QPP and PLM predictors, normalized, integrated by logistic regression, and converted into an answer or clarifying question decision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 34px 'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Meiryo', sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px 'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Meiryo', sans-serif; fill: #475569; }
      .label { font: 700 18px 'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Meiryo', sans-serif; fill: #0f172a; }
      .body { font: 500 15px 'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Meiryo', sans-serif; fill: #334155; }
      .small { font: 500 13px 'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Meiryo', sans-serif; fill: #64748b; }
      .mono { font: 600 15px 'SFMono-Regular', 'Consolas', monospace; fill: #1e293b; }
      .pill { font: 700 13px 'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Meiryo', sans-serif; fill: #ffffff; }
      .box { fill: url(#card); stroke: #cbd5e1; stroke-width: 1.2; filter: url(#shadow); }
      .thin { stroke: #475569; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 5; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="650" rx="28" fill="url(#bg)"/>
  <text x="60" y="62" class="title">Clarification Need Prediction in Conversational Search</text>
  <text x="60" y="93" class="subtitle">曖昧なクエリに対して、検索システムが「答える」か「聞き返す」かを予測する</text>

  <rect x="60" y="135" width="245" height="120" rx="20" class="box"/>
  <rect x="82" y="155" width="88" height="25" rx="12" fill="#2563eb"/>
  <text x="100" y="173" class="pill">Query</text>
  <text x="82" y="207" class="mono">What was Jordan's career?</text>
  <text x="82" y="232" class="small">同じ文字列でも、人物・国・ブランドなど複数の解釈があり得る</text>

  <rect x="380" y="120" width="260" height="95" rx="18" class="box"/>
  <text x="405" y="153" class="label">Pre-retrieval QPP</text>
  <text x="405" y="181" class="body">検索実行前の語彙統計</text>
  <text x="405" y="202" class="small">AvgIDF / MaxIDF / SCS / ...</text>

  <rect x="380" y="250" width="260" height="95" rx="18" class="box"/>
  <text x="405" y="283" class="label">Post-retrieval QPP</text>
  <text x="405" y="311" class="body">検索結果・スコア分布</text>
  <text x="405" y="332" class="small">Clarity / WIG / NQC / SMV / ...</text>

  <rect x="380" y="380" width="260" height="95" rx="18" class="box"/>
  <text x="405" y="413" class="label">Fine-tuned PLM</text>
  <text x="405" y="441" class="body">クエリの意味的特徴</text>
  <text x="405" y="462" class="small">BERT / RoBERTa</text>

  <rect x="715" y="190" width="185" height="94" rx="18" class="box"/>
  <text x="743" y="224" class="label">Min-Max</text>
  <text x="743" y="251" class="body">各スコアを 0-1 に正規化</text>

  <rect x="715" y="335" width="185" height="94" rx="18" class="box"/>
  <text x="740" y="369" class="label">Logistic</text>
  <text x="740" y="396" class="body">複数指標を線形に統合</text>
  <text x="740" y="417" class="small">L1 / L2 / ElasticNet</text>

  <rect x="970" y="190" width="170" height="94" rx="18" class="box"/>
  <text x="1001" y="224" class="label">Answer</text>
  <text x="1001" y="251" class="body">十分に明確なら直接回答</text>

  <rect x="970" y="335" width="170" height="94" rx="18" class="box"/>
  <text x="1001" y="369" class="label">Clarify</text>
  <text x="1001" y="396" class="body">曖昧なら質問を返す</text>

  <line x1="305" y1="195" x2="370" y2="168" class="thin"/>
  <line x1="305" y1="195" x2="370" y2="298" class="thin"/>
  <line x1="305" y1="195" x2="370" y2="428" class="thin"/>

  <path d="M 640 168 C 690 168, 675 235, 705 235" class="thin"/>
  <path d="M 640 298 C 675 298, 680 270, 705 250" class="thin"/>
  <path d="M 640 428 C 690 428, 675 382, 705 382" class="thin"/>
  <line x1="807" y1="284" x2="807" y2="325" class="thin"/>
  <path d="M 900 382 C 945 382, 935 382, 960 382" class="thin"/>
  <path d="M 900 382 C 940 382, 930 237, 960 237" class="thin"/>

  <rect x="60" y="520" width="1080" height="75" rx="18" fill="#0f172a" opacity="0.94"/>
  <text x="90" y="552" style="font: 700 18px 'Inter','Noto Sans JP','Hiragino Sans','Meiryo',sans-serif; fill: #ffffff;">Research question</text>
  <text x="90" y="579" style="font: 500 16px 'Inter','Noto Sans JP','Hiragino Sans','Meiryo',sans-serif; fill: #dbeafe;">PLM が捉える「意味的な曖昧さ」と、QPP が捉える「検索の難しさ」は、CNP で相補的に働くのか？</text>

  <path d="M 182 255 C 182 505, 1050 505, 1050 430" class="dash"/>
</svg>
