name: Finalize DEIM patch

on:
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'fix/deim-logit-diff-rf-tuning'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Fix probability loader call
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('LogReg/LASSO/main.py')
          text = path.read_text()
          old = "load_base_probabilities('dev', args.dataset, BASE_DIR, base_experiment_names=None, use_bert=use_bert, use_roberta=use_roberta, use_transfer=use_transfer, score_mode=args.plm_score_mode)"
          new = "load_base_probabilities('dev', args.dataset, BASE_DIR, base_experiment_names=None, use_bert=use_bert, use_roberta=use_roberta, use_transfer=use_transfer)"
          if text.count(old) != 1:
              raise RuntimeError(f'expected one probability loader call, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/finalize-deim.yml').unlink()
          PY

      - name: Install and test
        env:
          PYTHONPATH: LogReg/LASSO
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn matplotlib seaborn pytest
          python -m py_compile LogReg/LASSO/main.py LogReg/LASSO/module/data_loader.py LogReg/LASSO/module/models.py
          pytest -q LogReg/LASSO/tests/test_plm_scoring_and_random_forest.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix PLM probability loading compatibility"
          git push origin HEAD:${{ github.head_ref }}
