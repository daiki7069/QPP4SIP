name: DEIM experiments

on:
  pull_request:
    branches: [develop]
    paths:
      - "LogReg/LASSO/**"
      - "README.md"
      - ".github/workflows/deim-experiments.yml"
  workflow_dispatch:
    inputs:
      run_plm_training:
        description: "Run full BERT/RoBERTa fine-tuning (CPU-intensive)"
        required: false
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: pip install numpy pandas scipy scikit-learn matplotlib seaborn pytest
      - name: Compile and test
        env:
          PYTHONPATH: LogReg/LASSO
        run: |
          python -m py_compile \
            LogReg/LASSO/main.py \
            LogReg/LASSO/module/data_loader.py \
            LogReg/LASSO/module/models.py
          pytest -q LogReg/LASSO/tests/test_plm_scoring_and_random_forest.py

  random-forest:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install experiment dependencies
        run: pip install numpy pandas scipy scikit-learn matplotlib seaborn
      - name: Prepare expected project path
        run: |
          sudo mkdir -p /home/daiki_shibata/pj
          sudo ln -s "$GITHUB_WORKSPACE" /home/daiki_shibata/pj/QPP4SIP
          rm -rf LogReg/LASSO/outputs/AmbigNQ
      - name: Train and evaluate tuned RandomForest
        run: |
          python LogReg/LASSO/main.py \
            --dataset AmbigNQ \
            --retrieval-method dpr \
            --model-type randomforest \
            --feature-types pre post \
            --use-minmax-normalization \
            --no-cv
      - name: Upload all RandomForest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deim-random-forest-results
          path: LogReg/LASSO/outputs/AmbigNQ
          if-no-files-found: error
          retention-days: 30

  plm-training:
    if: github.event_name == 'workflow_dispatch' && inputs.run_plm_training
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        model: [bert-base-uncased, roberta-base]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install PLM dependencies
        run: pip install -r SIP/FT-PLM/requirements.txt
      - name: Fine-tune PLM
        run: |
          EXTRA_ARGS=""
          if [ "${{ matrix.model }}" = "roberta-base" ]; then
            EXTRA_ARGS="--early_stopping"
          fi
          python SIP/FT-PLM/main.py \
            --dataset AmbigNQ \
            --mode train \
            --model_name "${{ matrix.model }}" \
            --learning_rate 2e-5 \
            --batch_size 16 \
            --k_fold 5 \
            --output_dir SIP/FT-PLM/output \
            $EXTRA_ARGS
      - name: Evaluate PLM ensemble
        run: |
          if [ "${{ matrix.model }}" = "roberta-base" ]; then
            EXPERIMENT="AmbigNQ_roberta-base_lr2e-05_bs16_earlystop_kfold5"
          else
            EXPERIMENT="AmbigNQ_bert-base_lr2e-05_bs16_kfold5"
          fi
          python SIP/FT-PLM/main.py \
            --dataset AmbigNQ \
            --mode evaluate \
            --model_path "SIP/FT-PLM/output/AmbigNQ/$EXPERIMENT" \
            --output_dir SIP/FT-PLM/output
      - name: Upload all PLM outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "plm-${{ matrix.model }}-outputs"
          path: SIP/FT-PLM/output/AmbigNQ
          if-no-files-found: error
          retention-days: 30
