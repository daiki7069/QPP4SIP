name: Apply final DEIM patch

on:
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.head_ref == 'fix/deim-logit-diff-rf-tuning'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply minimal in-place changes
        run: |
          cat .github/scripts/apply_deim_patch.part00 \
              .github/scripts/apply_deim_patch.part01 \
              .github/scripts/apply_deim_patch.part02 \
              .github/scripts/apply_deim_patch.part03 \
              > /tmp/apply_deim_patch.py
          python -m py_compile /tmp/apply_deim_patch.py
          python /tmp/apply_deim_patch.py
          rm -f .github/scripts/apply_deim_patch.part*

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn matplotlib seaborn pytest

      - name: Validate implementation
        env:
          PYTHONPATH: LogReg/LASSO
        run: |
          python -m py_compile \
            LogReg/LASSO/main.py \
            LogReg/LASSO/module/data_loader.py \
            LogReg/LASSO/module/models.py
          pytest -q LogReg/LASSO/tests/test_plm_scoring_and_random_forest.py

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use PLM logit differences and tune RandomForest"
          git push origin HEAD:${{ github.head_ref }}
