name: Clean temporary patch files

on:
  push:
    branches:
      - deim-score-rf-tuning

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deim-score-rf-tuning
          fetch-depth: 0

      - name: Remove temporary files
        run: |
          rm .github/apply_deim_changes.py
          rm .github/workflows/apply-deim-changes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary patch files"
          git push origin HEAD:deim-score-rf-tuning
