name: Apply final DEIM patch

on:
  push:
    branches:
      - tmp/deim-final-clean-3
    paths:
      - .github/workflows/apply-deim-final.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/deim-final-clean-3
          fetch-depth: 0

      - name: Apply minimal in-place changes
        run: |
          cat > /tmp/apply_deim_patch.py <<'PY'
          import re
          from pathlib import Path


          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)


          # PLM feature score selection
          path = Path("LogReg/LASSO/module/data_loader.py")
          text = path.read_text()
          text = replace_once(text, "import json\n", "import json\nimport os\n", "os import")

          extract_pattern = re.compile(
              r"def extract_base_scores\(json_data: List\[List\[Dict\[str, Any\]\]\]\) -> Dict\[Tuple\[str, int\], float\]:\n"
              r".*?\n    return scores\n",
              re.DOTALL,
          )
          extract_replacement = '''def _resolve_plm_score_mode(score_mode: str = None) -> str:
              score_mode = score_mode or os.getenv('DEIM_PLM_SCORE_MODE', 'logit_diff')
              if score_mode not in ('logit_diff', 'positive_logit'):
                  raise ValueError(
                      "score_mode must be 'logit_diff' or 'positive_logit'"
                  )
              return score_mode


          def _extract_plm_score(turn: Dict[str, Any], score_mode: str):
              positive_logit = turn.get('logit_clarification')
              if positive_logit is None:
                  return None
              if score_mode == 'positive_logit':
                  return float(positive_logit)

              negative_logit = turn.get('logit_not_clarification')
              if negative_logit is None:
                  raise ValueError(
                      "logit_not_clarification is required for logit_diff mode"
                  )
              return float(positive_logit) - float(negative_logit)


          def extract_base_scores(json_data: List[List[Dict[str, Any]]], score_mode: str = None) -> Dict[Tuple[str, int], float]:
              """ベースモデルのPLMスコアを抽出する。"""
              score_mode = _resolve_plm_score_mode(score_mode)
              scores = {}
              for conversation in json_data:
                  for turn in conversation:
                      conv_id = str(turn['conv_id'])
                      turn_id = int(turn['turn_id'])
                      score = _extract_plm_score(turn, score_mode)
                      if score is not None:
                          scores[(conv_id, turn_id)] = score

              return scores
          '''
          text, count = extract_pattern.subn(extract_replacement, text, count=1)
          if count != 1:
              raise RuntimeError(f"extract_base_scores: expected 1 match, found {count}")

          start = text.index("def load_base_scores(")
          end = text.index("\ndef load_base_probabilities(", start)
          function = text[start:end]
          function = replace_once(
              function,
              "use_full_train_model_for_dev: bool = False) ->",
              "use_full_train_model_for_dev: bool = False, score_mode: str = None) ->",
              "load_base_scores signature",
          )
          function = replace_once(
              function,
              "    base_scores = {}\n",
              "    score_mode = _resolve_plm_score_mode(score_mode)\n    base_scores = {}\n",
              "load_base_scores mode initialization",
          )
          function = replace_once(
              function,
              "                logit = turn.get('logit_clarification')\n                if logit is not None:\n                    scores[key] = float(logit)\n",
              "                score = _extract_plm_score(turn, score_mode)\n                if score is not None:\n                    scores[key] = score\n",
              "load_base_scores extraction",
          )
          function = replace_once(
              function,
              "        print(f\"Loaded {len(scores)} {feature_name} scores for {split} (experiment: {exp_name})\")\n",
              "        print(f\"Loaded {len(scores)} {feature_name} scores for {split} (experiment: {exp_name}, score_mode: {score_mode})\")\n",
              "load_base_scores logging",
          )
          text = text[:start] + function + text[end:]
          path.write_text(text)

          # RandomForest hyperparameter search
          path = Path("LogReg/LASSO/module/models.py")
          text = path.read_text()
          marker = "\ndef create_model("
          class_definition = '''

          class RandomForestCVModel:
              """層化CVでハイパーパラメータを選択するRandomForest。"""

              def __init__(self, cv=5, random_state=42, class_weight='balanced',
                           scoring='roc_auc', n_jobs=-1, param_grid=None):
                  self.cv = cv
                  self.random_state = random_state
                  self.class_weight = class_weight
                  self.scoring = scoring
                  self.n_jobs = n_jobs
                  self.param_grid = param_grid or {
                      'n_estimators': [200, 500],
                      'max_depth': [3, 5, 10],
                      'min_samples_split': [2, 10],
                      'min_samples_leaf': [1, 4],
                      'max_features': ['sqrt', 0.5],
                  }
                  self.model_ = None
                  self.best_params_ = None
                  self.best_score_ = None

              def fit(self, X, y, print_and_save_func=None):
                  class_counts = Counter(y)
                  if len(class_counts) < 2:
                      raise ValueError('RandomForest tuning requires two classes')
                  n_splits = min(self.cv, min(class_counts.values()))
                  if n_splits < 2:
                      raise ValueError(
                          'RandomForest tuning requires at least two samples per class'
                      )

                  search = GridSearchCV(
                      RandomForestClassifier(
                          random_state=self.random_state,
                          class_weight=self.class_weight,
                          n_jobs=1,
                      ),
                      self.param_grid,
                      cv=StratifiedKFold(
                          n_splits=n_splits,
                          shuffle=True,
                          random_state=self.random_state,
                      ),
                      scoring=self.scoring,
                      n_jobs=self.n_jobs,
                      refit=True,
                  )
                  search.fit(X, y)
                  self.model_ = search.best_estimator_
                  self.best_params_ = search.best_params_
                  self.best_score_ = search.best_score_

                  message = (
                      f"RandomForest best params: {self.best_params_} "
                      f"({self.scoring}={self.best_score_:.4f})"
                  )
                  (print_and_save_func or print)(message)
                  return self

              def predict(self, X):
                  return self.model_.predict(X)

              def predict_proba(self, X):
                  return self.model_.predict_proba(X)

              @property
              def feature_importances_(self):
                  return self.model_.feature_importances_

              @property
              def classes_(self):
                  return self.model_.classes_
          '''
          if "class RandomForestCVModel:" in text:
              raise RuntimeError("RandomForestCVModel already exists")
          text = text.replace(marker, class_definition + marker, 1)

          rf_pattern = re.compile(
              r"    elif model_type == 'randomforest':\n.*?"
              r"    elif model_type == 'none':",
              re.DOTALL,
          )
          rf_replacement = '''    elif model_type == 'randomforest':
              return RandomForestCVModel(
                  cv=cv,
                  random_state=random_state,
                  class_weight=class_weight,
                  scoring=scoring,
                  n_jobs=n_jobs,
              )
              elif model_type == 'none':'''
          text, count = rf_pattern.subn(rf_replacement, text, count=1)
          if count != 1:
              raise RuntimeError(f"RandomForest factory: expected 1 match, found {count}")
          path.write_text(text)

          # CLI wiring and RandomForest CV-compatible visualization
          path = Path("LogReg/LASSO/main.py")
          text = path.read_text()
          argument = '''    parser.add_argument(
              "--plm-score-mode",
              type=str,
              choices=["logit_diff", "positive_logit"],
              default="logit_diff",
              help="PLMスコア方式（logit_diff: 正例logit-負例logit, positive_logit: 従来の正例logitのみ）"
          )

          '''
          text = replace_once(
              text,
              "    parser.add_argument(\n        \"--save-model\",\n",
              argument + "    parser.add_argument(\n        \"--save-model\",\n",
              "PLM score argument",
          )
          text = replace_once(
              text,
              "    print_and_save(f\"使用する特徴量タイプ: {', '.join(args.feature_types)}\")\n",
              "    print_and_save(f\"使用する特徴量タイプ: {', '.join(args.feature_types)}\")\n    print_and_save(f\"PLMスコア方式: {args.plm_score_mode}\")\n",
              "PLM score logging",
          )
          if text.count("use_transfer=use_transfer)") != 2:
              raise RuntimeError("Expected two standard load_base_scores calls")
          text = text.replace(
              "use_transfer=use_transfer)",
              "use_transfer=use_transfer, score_mode=args.plm_score_mode)",
          )
          text = replace_once(
              text,
              "use_full_train_model_for_dev=True)",
              "use_full_train_model_for_dev=True, score_mode=args.plm_score_mode)",
              "graph load_base_scores call",
          )
          condition = "current_model_type in ['bolasso', 'lars_traps', 'lars_cv']"
          if text.count(condition) != 3:
              raise RuntimeError(
                  f"Expected three model fit conditions, found {text.count(condition)}"
              )
          text = text.replace(
              condition,
              "current_model_type in ['bolasso', 'lars_traps', 'lars_cv', 'randomforest']",
          )

          ensemble_pattern = re.compile(
              r"        # 可視化のために、モデルオブジェクトを作成.*?"
              r"        model = EnsembleModel\(mean_coefs, intercept_mean\)\n",
              re.DOTALL,
          )
          ensemble_replacement = '''        # 可視化用のアンサンブルモデルを作成
              if current_model_type == 'randomforest':
                  class EnsembleModel:
                      def __init__(self, models):
                          self.models = models

                      def predict_proba(self, X):
                          return np.mean(
                              [model.predict_proba(X) for model in self.models], axis=0
                          )

                  model = EnsembleModel(fold_models)
              else:
                  class EnsembleModel:
                      def __init__(self, mean_coefs, intercept_mean):
                          self.coef_ = mean_coefs.reshape(1, -1)
                          self.intercept_ = intercept_mean

                      def predict_proba(self, X):
                          if isinstance(X, pd.DataFrame):
                              X_array = X.values
                          else:
                              X_array = X
                          z = X_array @ self.coef_[0] + self.intercept_
                          proba_positive = expit(z)
                          proba_negative = 1 - proba_positive
                          return np.column_stack([proba_negative, proba_positive])

                  intercept_mean = np.mean(
                      [model.intercept_ for model in fold_models]
                  )
                  model = EnsembleModel(mean_coefs, intercept_mean)
          '''
          text, count = ensemble_pattern.subn(ensemble_replacement, text, count=1)
          if count != 1:
              raise RuntimeError(f"Ensemble block: expected 1 match, found {count}")
          path.write_text(text)

          # Documentation in the relevant sections
          path = Path("README.md")
          text = path.read_text()
          text = replace_once(
              text,
              "論文の表 1 における BERT / RoBERTa 条件に対応します。ここで出力される logits は、表 2 の BERT / RoBERTa 付き統合条件でも特徴量として使用されます。\n",
              "論文の表 1 における BERT / RoBERTa 条件に対応します。ここで出力される logits は、表 2 の BERT / RoBERTa 付き統合条件でも特徴量として使用されます。`*_with_predictions.json` には正例・負例両方のlogitが保存されるため、logit差の利用に再学習・再推論は不要です。\n",
              "README PLM output note",
          )
          text = replace_once(
              text,
              "論文の表 2 に対応します。`--feature-types` で実験条件を指定します。\n",
              "論文の表 2 に対応します。`--feature-types` で実験条件を指定します。PLM特徴量はデフォルトで `logit_clarification - logit_not_clarification` を使用します。従来の正例logitのみを使う場合は `--plm-score-mode positive_logit` を指定します。\n",
              "README PLM score mode",
          )
          text = replace_once(
              text,
              "主要な特徴量組み合わせをまとめて実行する場合:\n",
              "`--model-type randomforest` では、層化交差検証によるハイパーパラメータ探索を行い、`n_estimators`, `max_depth`, `min_samples_split`, `min_samples_leaf`, `max_features` をAUC-ROCで選択します。\n\n主要な特徴量組み合わせをまとめて実行する場合:\n",
              "README RandomForest search",
          )
          path.write_text(text)

          # Focused regression tests
          path = Path("LogReg/LASSO/tests/test_plm_scoring_and_random_forest.py")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text('''import json
          
          import numpy as np
          import pytest
          
          from module import data_loader
          from module.models import RandomForestCVModel, create_model, get_coefficients
          
          
          def prediction_data():
              return [[{
                  "conv_id": "conv-1",
                  "turn_id": 0,
                  "logit_clarification": 2.0,
                  "logit_not_clarification": 0.5,
              }]]
          
          
          def test_plm_score_defaults_to_logit_difference():
              scores = data_loader.extract_base_scores(prediction_data())
              assert scores[("conv-1", 0)] == pytest.approx(1.5)
          
          
          def test_positive_logit_mode_is_retained():
              scores = data_loader.extract_base_scores(
                  prediction_data(), score_mode="positive_logit"
              )
              assert scores[("conv-1", 0)] == pytest.approx(2.0)
          
          
          def test_load_base_scores_uses_selected_mode(tmp_path, monkeypatch):
              experiment = "AmbigNQ_bert-base_test"
              output_dir = (
                  tmp_path / "SIP" / "FT-PLM" / "output" /
                  "AmbigNQ" / experiment
              )
              output_dir.mkdir(parents=True)
              with open(output_dir / "train_with_predictions.json", "w") as f:
                  json.dump(prediction_data(), f)
              monkeypatch.setattr(
                  data_loader, "BASE_EXPERIMENT_NAMES", [experiment]
              )
          
              scores = data_loader.load_base_scores(
                  "train", "AmbigNQ", tmp_path,
                  use_bert=True, use_roberta=False,
              )
              assert scores["bert_logit_clarification"][("conv-1", 0)] == pytest.approx(1.5)
          
          
          def test_random_forest_hyperparameters_are_selected_by_cv():
              X = np.array([[i, i % 3] for i in range(24)])
              y = np.array([0] * 12 + [1] * 12)
              model = create_model(
                  "randomforest", cv=2, n_jobs=1, random_state=0
              )
              assert isinstance(model, RandomForestCVModel)
              model.param_grid = {
                  "n_estimators": [10],
                  "max_depth": [2, 4],
                  "min_samples_split": [2],
                  "min_samples_leaf": [1],
                  "max_features": ["sqrt"],
              }
              model.fit(X, y)
          
              assert model.best_params_["max_depth"] in {2, 4}
              importances = get_coefficients(
                  model, ["feature_1", "feature_2"], "randomforest"
              )
              assert len(importances) == X.shape[1]
          ''')
          PY
          python /tmp/apply_deim_patch.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn matplotlib seaborn pytest

      - name: Validate implementation
        env:
          PYTHONPATH: LogReg/LASSO
        run: |
          python -m py_compile \
            LogReg/LASSO/main.py \
            LogReg/LASSO/module/data_loader.py \
            LogReg/LASSO/module/models.py
          pytest -q LogReg/LASSO/tests/test_plm_scoring_and_random_forest.py

      - name: Commit verified changes
        run: |
          rm .github/workflows/apply-deim-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use PLM logit differences and tune RandomForest"
          git push origin HEAD:tmp/deim-final-clean-3
