[project]
name = "qpp4sip"
version = "0.1.0"
description = "Query Performance Prediction for System Initiative Prediction"
readme = "README.md"
requires-python = ">=3.8,<3.12"
authors = [
    {name = "QPP4SIP Team"}
]
keywords = ["nlp", "conversation", "query-performance", "system-initiative"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "numpy>=1.21.0,<2.0.0",
    "pandas>=1.3.0,<2.3.0",
    "scikit-learn>=1.0.0,<1.4.0",
    "tensorboard>=2.8.0,<2.20.0",
    "torch>=1.12.0,<2.1.0",
    "transformers>=4.20.0,<4.40.0",
]

[project.scripts]
qpp4sip-train = "model.run:main"
qpp4sip-inference = "model.run:main"
qpp4sip-evaluate = "evaluation.evaluation:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["model*", "evaluation*"]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"
